[package]
name = "landict"
version = "0.1.11"
description = "A local-first English learning workspace for Windows"
authors = ["LanDict"]
edition = "2021"

[lib]
name = "landict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
tokio = { version = "1", features = ["sync", "macros"] }
regex = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
windows = { version = "0.61", features = [
  "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole",
  "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader",
] }
