<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LanDict · 生词本（工作台档 1040）</title>
<!--
  工作台档 1040：在"适配版"的基础上只改内容列宽度（900 → 1040），字体和层级一律不动。
  - 版式：没有页面标题；上边距 28px（--page-top）、左右最小留白 36px（--page-inline）；内容列居中
  - 宽度：正文型页面 900（阅读 / 翻译结果），工作台型页面 1040（生词本 / 背单词）；底部可切 900 / 1040 / 1160 直接比
  - 字号层级（与适配版完全一致，6 档）：12 / 14 / 16 / 20 / 36 / 40
  - 筛选只保留标签行；排序按钮在搜索框旁边；计数在列表面板抬头
-->
<style>
@font-face{font-family:"Noto Sans SC";src:url("/src/assets/fonts/NotoSansSC-VF.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{
  --bg-app:#f7fbff; --bg-surface:#ffffff; --bg-soft:#f1f7fd; --bg-active:#eaf4ff; --bg-hover:#f5f9fd;
  --blue-primary:#2f7cf6; --blue-hover:#1f6ff2;
  --border-soft:#e8eef5; --border-default:#d9e6f2;
  --text-primary:#102247; --text-secondary:#66758f; --text-muted:#94a3b8;
  --status-pending:#cf5561; --status-pending-bg:#fdecee;
  --status-learning:#c1701a; --status-learning-bg:#fdf1e0;
  --status-mastered:#3f7f5f; --status-mastered-bg:#e9f3ec;
  --r-control:12px; --r-card:16px; --r-panel:20px;
  --shadow-card:0 8px 24px rgb(42 79 120 / 7%);
  --page-width:1040px; --page-top:28px; --page-inline:36px; --page-bottom:28px;
  --font:"Noto Sans SC",sans-serif;
  /* 六个字号，全部来自 app 的语义 token */
  --fs-page:36px;      /* --type-page-title（本页未用，留作详情单词锚点参考） */
  --fs-word:40px;      /* --type-word-title  详情里的单词 */
  --fs-row:20px;       /* --type-card-title  列表里的单词 */
  --fs-body:16px;      /* --type-body        释义、例句、面板标题、按钮、搜索框 */
  --fs-sub:14px;       /* --type-secondary   列表释义、译文、音标、标签、状态按钮、筛选标签 */
  --fs-meta:12px;      /* --type-muted       状态标签、分区小标题、来源日期、计数 */
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-app);color:var(--text-primary);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex-shrink:0}

/* 外壳：侧栏 184px、顶栏 56px（app 现有） */
.app{display:grid;height:100vh;grid-template-columns:184px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
.topbar{display:flex;grid-column:1/-1;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border-soft);background:rgb(255 255 255 / 56%);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.3px}
.brand-mark{display:grid;width:30px;height:30px;place-items:center;border-radius:10px;background:linear-gradient(135deg,#498dff,#2472f3);color:#fff}
.window-actions{display:flex;align-items:center;gap:18px;color:var(--text-muted)}
.sidebar{display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--border-soft);background:rgb(255 255 255 / 56%);backdrop-filter:blur(18px)}
.nav{display:grid;gap:4px}
.nav-item{display:flex;height:44px;align-items:center;gap:12px;padding:0 14px;border-radius:var(--r-control);color:var(--text-secondary);font-size:var(--fs-body);font-weight:500;text-align:left}
.nav-item:hover{background:var(--bg-hover)}
.nav-item[aria-current="page"]{background:var(--bg-active);color:var(--blue-primary)}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft)}

/* 主内容：与其它页面一致的 900px 居中列 + 28/36 边距，没有页面标题 */
.main{min-height:0;overflow:auto;padding:var(--page-top) var(--page-inline) var(--page-bottom);background:rgb(255 255 255 / 74%)}
.content{width:min(var(--page-width),100%);margin:0 auto}
/* 内容列宽度：正文档 900 / 工作台档 1040 / 旧版 1160，底部可切换直接比 */
body[data-width="900"]{--page-width:900px}
body[data-width="1040"]{--page-width:1040px}
body[data-width="1160"]{--page-width:1160px}
.workspace{display:grid;grid-template-columns:minmax(300px,43fr) minmax(0,57fr);gap:24px;align-items:start}
.column{display:flex;min-width:0;flex-direction:column;gap:12px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tools-end{justify-content:flex-end}

.search{display:flex;min-width:110px;height:44px;flex:1 1 130px;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border-default);border-radius:var(--r-control);background:var(--bg-surface)}
.search:focus-within{border-color:var(--blue-primary);box-shadow:0 0 0 3px rgb(47 124 246 / 16%)}
.search svg{color:var(--text-muted)}
.search input{width:100%;height:100%;border:0;background:none;outline:0;font-family:inherit;font-size:var(--fs-body);color:var(--text-primary)}
.search input::placeholder{color:var(--text-muted)}

.btn{display:inline-flex;height:42px;align-items:center;gap:8px;padding:0 16px;border:1px solid transparent;border-radius:var(--r-control);font-size:var(--fs-body);font-weight:500;white-space:nowrap}
.btn-primary{background:var(--blue-primary);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-secondary{border-color:var(--border-default);background:var(--bg-surface);color:var(--text-primary)}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-icon{width:32px;height:32px;justify-content:center;padding:0;border-radius:10px;color:var(--text-muted)}
.btn-icon:hover{background:var(--bg-hover);color:var(--text-primary)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filter{display:inline-flex;height:32px;align-items:center;gap:6px;padding:0 12px;border-radius:10px;background:var(--bg-soft);color:var(--text-secondary);font-size:var(--fs-sub)}
.filter:hover{color:var(--text-primary)}
.filter[aria-pressed="true"]{background:var(--bg-active);color:var(--blue-primary)}

.panel{display:flex;min-width:0;flex-direction:column;border:1px solid var(--border-soft);border-radius:var(--r-panel);background:var(--bg-surface);box-shadow:var(--shadow-card);padding:16px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-title{font-size:var(--fs-body);font-weight:500}
.panel-count{margin-left:6px;color:var(--text-muted);font-size:var(--fs-meta)}
.panel-stat{color:var(--text-muted);font-size:var(--fs-meta)}
.list{display:grid;gap:8px}
.row{display:flex;min-width:0;align-items:center;gap:10px;padding:13px 12px 13px 16px;border:1px solid var(--border-soft);border-radius:var(--r-card);background:var(--bg-surface);cursor:pointer}
.row:hover{background:var(--bg-hover)}
.row[aria-selected="true"]{background:var(--bg-active);border-color:var(--border-default);box-shadow:inset 3px 0 0 var(--blue-primary)}
.row-main{display:grid;min-width:0;flex:1;gap:4px}
.row-top{display:flex;min-width:0;align-items:center;gap:8px}
.row-word{overflow:hidden;font-size:var(--fs-row);font-weight:500;letter-spacing:-.2px;text-overflow:ellipsis;white-space:nowrap}
.row-meaning{margin:0;overflow:hidden;color:var(--text-secondary);font-size:var(--fs-sub);line-height:1.5;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:8px;font-size:var(--fs-meta);font-weight:500;line-height:1.3;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.status-pending{background:var(--status-pending-bg);color:var(--status-pending)}
.status-learning{background:var(--status-learning-bg);color:var(--status-learning)}
.status-mastered{background:var(--status-mastered-bg);color:var(--status-mastered)}

.detail{display:flex;flex-direction:column;gap:14px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{color:var(--text-muted);font-size:var(--fs-meta);letter-spacing:.6px}
.detail-word{margin:0;font-size:var(--fs-word);font-weight:700;line-height:1.25;letter-spacing:-1px}
.phonetics{display:flex;flex-wrap:wrap;gap:14px}
.phonetic{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:var(--fs-sub)}
.phonetic:hover{color:var(--blue-primary)}
.phonetic svg{color:var(--blue-primary)}
.section{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--border-soft)}
.section:first-of-type{padding-top:0;border-top:0}
.section h3{margin:0;color:var(--text-muted);font-size:var(--fs-meta);font-weight:500}
.definition{margin:0;font-size:var(--fs-body);line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:5px 9px;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-soft);color:var(--text-secondary);font-size:var(--fs-sub)}
.example-en{margin:0;font-size:var(--fs-body);line-height:1.7}
.example-cn{margin:0;color:var(--text-secondary);font-size:var(--fs-sub);line-height:1.5}
.study{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--border-soft)}
.study-actions{display:flex;flex-wrap:wrap;gap:6px}
.study-action{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--border-default);border-radius:10px;color:var(--text-secondary);font-size:var(--fs-sub)}
.study-action i{width:6px;height:6px;border-radius:50%;background:currentColor}
.study-action[aria-pressed="true"]{border-color:currentColor;font-weight:500}
.study-action[data-status="pending"][aria-pressed="true"]{background:var(--status-pending-bg);color:var(--status-pending)}
.study-action[data-status="learning"][aria-pressed="true"]{background:var(--status-learning-bg);color:var(--status-learning)}
.study-action[data-status="mastered"][aria-pressed="true"]{background:var(--status-mastered-bg);color:var(--status-mastered)}
.source{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--border-soft);color:var(--text-muted);font-size:var(--fs-meta)}
.source span{display:inline-flex;align-items:center;gap:6px}
.width-switch{position:fixed;left:50%;bottom:20px;z-index:30;display:flex;align-items:center;gap:8px;transform:translateX(-50%);padding:8px 12px;border:1px solid var(--border-default);border-radius:14px;background:var(--bg-surface);box-shadow:0 16px 36px rgb(22 61 115 / 13%);font-size:12px;color:var(--text-muted)}
.width-switch-button{padding:6px 10px;border-radius:8px;color:var(--text-secondary);font-size:12px}
.width-switch-button[aria-pressed="true"]{background:var(--bg-active);color:var(--blue-primary);font-weight:500}
</style>
</head>

<script>
(() => {
'use strict';
const icon = (id, size = 16) => `<svg width="${size}" height="${size}" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${id}"></use></svg>`;
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SORTS = ['最近收藏', '最早收藏', '单词 A–Z', '单词 Z–A'];
const words = [
  { id: 'virus', word: 'virus', meaning: '病毒；滤过性病毒；毒害', part: 'noun', uk: '/ˈvaɪrəs/', us: '/ˈvaɪrəs/', status: 'pending', source: '本地词库', added: '2026/10/7',

  { id: 'eat', word: 'eat', meaning: '吃；腐蚀', part: 'verb', uk: '/iːt/', us: '/iːt/', status: 'mastered', source: 'Collins MDX 本地词库', added: '2026/10/2',
    phrases: [], example: 'I was too nervous to eat.', exampleCn: '我紧张得饭都吃不下。' },
  { id: 'dock', word: 'dock', meaning: '码头；船坞；被告席；使靠码头；使(船)进港；剪短；进港', part: 'noun · verb', uk: '/dɒk/', us: '/dɑːk/', status: 'mastered', source: '本地词库', added: '2026/9/29',
    phrases: [['loading dock', '装卸码头']], example: 'The ship docked at dawn.', exampleCn: '船在黎明时靠岸。' },
  { id: 'serendipity', word: 'serendipity', meaning: '偶然发现珍宝的运气/才能；易遇奇缘的运气', part: 'noun', uk: '/ˌserənˈdɪpəti/', us: '/ˌserənˈdɪpəti/', status: 'mastered', source: '本地词库', added: '2026/9/28',
    phrases: [['pure serendipity', '纯粹的机缘']], example: 'It was pure serendipity.', exampleCn: '那完全是机缘巧合。' },
];
let selectedId = words[0].id;
let filter = 'all';
let sort = 0;
let masked = false;
let revealed = new Set();
const byId = (id) => document.getElementById(id);
const statusPill = (status) => `<span class="status status-${status}"><i></i>${STATUS[status]}</span>`;
const hidden = (entry) => masked && !revealed.has(entry.id);

function visible() {
  const list = words.filter((entry) => filter === 'all' || entry.status === filter);
  if (sort === 1) return [...list].reverse();
  if (sort === 2) return [...list].sort((a, b) => a.word.localeCompare(b.word, 'en'));
  if (sort === 3) return [...list].sort((a, b) => b.word.localeCompare(a.word, 'en'));
  return list;
}

function renderList() {
  const list = visible();
  const pending = words.filter((entry) => entry.status === 'pending').length;
  byId('listCount').textContent = `${list.length} / ${words.length}`;
  byId('panelStat').textContent = masked ? '遮挡模式 · 点击揭晓释义' : `待学习 ${pending}`;
  byId('list').innerHTML = list.map((entry) => `
    <div class="row" role="button" tabindex="0" aria-selected="${entry.id === selectedId}" data-id="${entry.id}">
      <div class="row-main">
        <div class="row-top"><span class="row-word">${esc(entry.word)}</span>${statusPill(entry.status)}</div>
        ${hidden(entry)
          ? `<button class="filter" type="button" data-reveal="${entry.id}" style="justify-self:start">${icon('i-eye', 14)}点击揭晓中文释义</button>`
          : `<p class="row-meaning">${esc(entry.meaning)}</p>`}
      </div>
      <button class="btn-icon" type="button" data-remove="${entry.id}" aria-label="移出 ${esc(entry.word)}">${icon('i-close', 16)}</button>
    </div>`).join('');
}

function renderDetail() {
  const entry = words.find((item) => item.id === selectedId) ?? words[0];
  byId('detail').innerHTML = `
    <div class="detail-top"><span class="eyebrow">词条详情</span>${statusPill(entry.status)}</div>
    <div style="display:grid;gap:8px">
      <h2 class="detail-word">${esc(entry.word)}</h2>
      <div class="phonetics">
        <button class="phonetic" type="button">${icon('i-sound', 16)}英 ${esc(entry.uk)}</button>
        <button class="phonetic" type="button">${icon('i-sound', 16)}美 ${esc(entry.us)}</button>
      </div>
    </div>
    <section class="section">
      <h3>中文释义</h3>
      ${hidden(entry) ? `<button class="btn btn-secondary" type="button" data-reveal="${entry.id}" style="justify-self:start">${icon('i-eye', 16)}点击显示中文释义</button>` : `<p class="definition">${esc(entry.meaning)}</p>`}
    </section>
    <section class="section">
      <h3>词性</h3>
      <div class="tags">${entry.part.split(' · ').map((part) => `<span class="tag">${esc(part)}</span>`).join('')}</div>
    </section>
    <section class="section">
      <h3>常见搭配</h3>
      ${entry.phrases.length ? `<div class="tags">${entry.phrases.map(([phrase, cn]) => `<span class="tag">${esc(phrase)}（${esc(cn)}）</span>`).join('')}</div>` : '<p class="example-cn" style="color:var(--text-muted)">暂无常见搭配</p>'}
    </section>
    <section class="section">
      <h3>常见例句</h3>
      <p class="example-en">${esc(entry.example)}</p>
      ${hidden(entry) ? `<button class="btn btn-secondary" type="button" data-reveal="${entry.id}" style="justify-self:start">${icon('i-eye', 16)}点击显示译文</button>` : `<p class="example-cn">${esc(entry.exampleCn)}</p>`}
    </section>
    <section class="study">
      <h3 style="margin:0;color:var(--text-muted);font-size:var(--fs-meta);font-weight:500">学习状态</h3>
      <div class="study-actions">
        ${Object.keys(STATUS).map((status) => `<button class="study-action" type="button" data-status="${status}" aria-pressed="${entry.status === status}"><i></i>${STATUS[status]}</button>`).join('')}
      </div>
    </section>
    <footer class="source">
      <span>${icon('i-bookmark', 14)}${esc(entry.source)}</span>
      <span>${icon('i-clock', 14)}收藏于 ${esc(entry.added)}</span>
    </footer>`;
}

function render() { renderList(); renderDetail(); }

byId('list').addEventListener('click', (event) => {
  const reveal = event.target.closest('[data-reveal]');
  if (reveal) { revealed.add(reveal.dataset.reveal); render(); return; }
  const remove = event.target.closest('[data-remove]');
  if (remove) { revealed.delete(remove.dataset.remove); return; }
  const row = event.target.closest('.row');
  if (row) { selectedId = row.dataset.id; render(); }
});

byId('detail').addEventListener('click', (event) => {
  const reveal = event.target.closest('[data-reveal]');
  if (reveal) { revealed.add(reveal.dataset.reveal); render(); return; }
  const status = event.target.closest('[data-status]');
  if (!status) return;
  const entry = words.find((item) => item.id === selectedId);
  if (!entry) return;
  entry.status = status.dataset.status;
  render();
});

byId('maskButton').addEventListener('click', () => {
  masked = !masked;
  revealed = new Set();
  byId('maskButton').setAttribute('aria-pressed', String(masked));
  byId('maskButton').innerHTML = masked
    ? `${icon('i-eye', 16)}<span>显示全部释义</span>`
    : `${icon('i-eye-off', 16)}<span>隐藏释义</span>`;
  render();
});

byId('filters').addEventListener('click', (event) => {
  const chip = event.target.closest('[data-filter]');
  if (!chip) return;
  filter = chip.dataset.filter;
  byId('filters').querySelectorAll('[data-filter]').forEach((item) => item.setAttribute('aria-pressed', String(item.dataset.filter === filter)));
  renderList();
});

byId('sortButton').addEventListener('click', () => {
  sort = (sort + 1) % SORTS.length;
  byId('sortLabel').textContent = SORTS[sort];
  renderList();
});

render();
})();
</script>

<div class="width-switch" role="group" aria-label="内容列宽度">
  <span>内容列宽度</span>
  <button class="width-switch-button" type="button" data-width="900" aria-pressed="false">900（正文档）</button>
  <button class="width-switch-button" type="button" data-width="1040" aria-pressed="true">1040（工作台档）</button>
  <button class="width-switch-button" type="button" data-width="1160" aria-pressed="false">1160（旧版）</button>
</div>
<script>
document.querySelectorAll(".width-switch-button").forEach((button) => {
  button.addEventListener("click", () => {
    document.body.dataset.width = button.dataset.width;
    document.querySelectorAll(".width-switch-button").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
  });
});
</script>
</body>
</html>
