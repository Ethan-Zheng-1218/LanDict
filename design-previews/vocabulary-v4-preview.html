.study-action.learning .dot{background:var(--orange)}
.import-modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow-y:auto}
.import-modal .modal-description{margin:12px 0 16px}
.import-label{display:block;margin-bottom:7px;color:var(--muted);font-size:11px;letter-spacing:.2px}
.import-textarea{width:100%;min-height:118px;max-height:230px;resize:vertical;padding:11px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-soft);color:var(--text);font-family:"Consolas","Microsoft YaHei UI",monospace;font-size:12px;line-height:1.8;outline:0;transition:.18s}
.import-textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--focus)}
.import-or{display:flex;align-items:center;gap:10px;margin:13px 0;color:var(--muted);font-size:11px}
.import-or::before,.import-or::after{content:"";height:1px;flex:1;background:var(--border)}
.dropzone.compact{min-height:56px;flex-direction:row;gap:11px;padding:12px 14px;text-align:left}
.dropzone.compact>svg{width:19px;height:19px}
.dropzone.compact strong{font-size:12px}
.dropzone.dragging{border-color:var(--accent);background:var(--accent-tint)}
.dropzone-copy{display:flex;min-width:0;flex-direction:column;gap:3px}
.import-preview{margin-top:13px;min-height:46px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-soft);color:var(--text-soft);font-size:11px;line-height:1.7}
.import-preview.empty{display:flex;align-items:center;color:var(--muted)}
.preview-summary strong{color:var(--accent);font-weight:700}
.modal-note{line-height:1.7}
.modal-footer .footer-actions{display:flex;flex-shrink:0;gap:8px}
.modal-footer .ghost-btn{border:1px solid var(--border);background:transparent;color:var(--text-soft);font-weight:600}
.modal-footer .ghost-btn:hover{border-color:var(--border-strong);color:var(--text)}
.modal-footer .confirm-btn{padding:9px 14px;border-radius:9px;background:var(--accent);color:#fff;font-weight:650}
.modal-footer .confirm-btn:hover{background:var(--accent-hover)}
.modal-footer .confirm-btn:disabled{opacity:.45;cursor:not-allowed}
[data-theme="dark"] .modal-footer .confirm-btn{color:#111b2a}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
(() => {
'use strict';
const icons = {check:'ic-check',close:'ic-close',eye:'ic-eye',eyeOff:'ic-eye-off',sound:'ic-sound',clock:'ic-clock',notes:'ic-notes',search:'ic-search'};
const svg = (id,cls='') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"></use></svg>`;
const esc = (s) => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed = [
{word:'follow',meaning:'跟随；沿行；遵循；追求；接着；追随',part:'verb · noun',uk:'/ˈfɒləʊ/',us:'/ˈfɑːloʊ/',phrases:['as follows','follow up with sb','follow (from sth)','follow through'],example:'He followed her into the house.',exampleCn:'他跟随她走进房屋。',status:'learning',source:'翻译 · 查词收藏'},
{word:'more',meaning:'更多；多；进一步',part:'adjective · adverb',uk:'/mɔː(r)/',us:'/mɔːr/',phrases:['more and more','what is more','more than'],example:'She wants to learn more about the world.',exampleCn:'她想更多地了解这个世界。',status:'pending',source:'阅读 · 划词收藏'},
{word:'been',meaning:'be 的过去分词',part:'verb',uk:'/biːn/',us:'/bɪn/',phrases:['have been','has been','been to'],example:'I have been there twice.',exampleCn:'我去过那里两次。',status:'pending',source:'翻译 · 查词收藏'},
{word:'virus',meaning:'病毒；滤过性病毒；毒害',part:'noun',uk:'/ˈvaɪrəs/',us:'/ˈvaɪrəs/',phrases:['computer virus','virus infection','spread a virus'],example:'The virus can spread quickly.',exampleCn:'这种病毒可能迅速传播。',status:'pending',source:'阅读 · 划词收藏'},
{word:'dog',meaning:'狗；坏蛋；跟踪；尾随',part:'noun · verb',uk:'/dɒɡ/',us:'/dɔːɡ/',phrases:['a pet dog','walk the dog','dog days'],example:'The dog was sleeping by the door.',exampleCn:'那只狗正在门边睡觉。',status:'mastered',source:'翻译 · 查词收藏'},
{word:'cat',meaning:'猫；恶妇',part:'noun',uk:'/kæt/',us:'/kæt/',phrases:['pet cat','a black cat','cat nap'],example:'My cat likes to sit near the window.',exampleCn:'我的猫喜欢坐在窗边。',status:'mastered',source:'翻译 · 查词收藏'},
{word:'connect',meaning:'连接；联合；联系',part:'verb',uk:'/kəˈnekt/',us:'/kəˈnekt/',phrases:['connect with','connect to','stay connected'],example:'This bridge connects the two towns.',exampleCn:'这座桥连接着两个城镇。',status:'learning',source:'阅读 · 划词收藏'},
{word:'summer',meaning:'夏季；全盛时期；避暑；过夏天',part:'noun · verb',uk:'/ˈsʌmə(r)/',us:'/ˈsʌmər/',phrases:['summer holiday','this summer','summer vacation'],example:'We spent the summer by the sea.',exampleCn:'我们在海边度过了夏天。',status:'mastered',source:'翻译 · 查词收藏'},
{word:'remarkable',meaning:'非凡的；引人注目的；显著的',part:'adjective',uk:'/rɪˈmɑːkəbəl/',us:'/rɪˈmɑːrkəbəl/',phrases:['remarkable progress','quite remarkable'],example:'She made remarkable progress in English.',exampleCn:'她的英语取得了显著进步。',status:'pending',source:'阅读 · 划词收藏'},
{word:'glimpse',meaning:'一瞥；短暂的感受；瞥见',part:'noun · verb',uk:'/ɡlɪmps/',us:'/ɡlɪmps/',phrases:['catch a glimpse of','glimpse into'],example:'I caught a glimpse of the mountains.',exampleCn:'我瞥见了远处的群山。',status:'pending',source:'阅读 · 划词收藏'},
{word:'resilient',meaning:'有韧性的；能迅速恢复的',part:'adjective',uk:'/rɪˈzɪliənt/',us:'/rɪˈzɪliənt/',phrases:['resilient economy','remain resilient'],example:'Children can be surprisingly resilient.',exampleCn:'孩子们有时会表现出惊人的适应力。',status:'learning',source:'阅读 · 划词收藏'},
].map((item,i)=>({...item,id:'sample-'+i,createdAt:Date.now()-(i*3600000),note:''}));
const statusMap = {pending:'待学习',learning:'学习中',mastered:'已掌握'};
const sortMap = {recent:'最近收藏',oldest:'最早收藏',az:'单词 A–Z',za:'单词 Z–A'};
const storageKey = 'landict-vocab-preview-v2';
const byId = id => document.getElementById(id);
function load(){try {const x=JSON.parse(localStorage.getItem(storageKey));if(x&&Array.isArray(x.words))return x;}catch(e){}return {words:seed,theme:'blue'};}
const saved=load();let words=saved.words, theme=['blue','green','dark'].includes(saved.theme)?saved.theme:'blue';let selectedId=words[0]?.id||null,filter='all',sort='recent',query='',hide=false,revealed=new Set();let toastTimer=null,toastCountdown=null,undoItem=null;
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({words,theme}));}catch(e){}}
function setTheme(t){theme=t;document.body.dataset.theme=t;document.querySelectorAll('[data-choice]').forEach(b=>{const on=b.dataset.choice===t;b.classList.toggle('chosen',on);b.setAttribute('aria-pressed',on?'true':'false');});persist();}
function visibleWords(){let r=words.filter(w=>(filter==='all'||w.status===filter)&&(w.word.toLocaleLowerCase().includes(query)||w.meaning.toLocaleLowerCase().includes(query)));if(sort==='recent')r.sort((a,b)=>b.createdAt-a.createdAt);else if(sort==='oldest')r.sort((a,b)=>a.createdAt-b.createdAt);else r.sort((a,b)=>a.word.localeCompare(b.word,'en')*(sort==='az'?1:-1));return r;}
function statusHTML(s){return `<span class="status ${esc(s)}"><span class="dot"></span>${statusMap[s]||statusMap.none}</span>`;}
function renderList(){const view=visibleWords();const pendingCount=words.filter(word=>word.status==='pending').length;byId('totalCount').textContent=`共 ${words.length} 个单词 · 待学习 ${pendingCount}`;byId('shownCount').textContent=`${view.length} / ${words.length}`;byId('listTip').textContent=hide?'遮挡模式 · 点击揭晓释义':'选择单词查看详情';
byId('wordList').innerHTML=view.length?view.map(w=>{const conceal=hide&&!revealed.has(w.id);return `<div class="word-card ${selectedId===w.id?'selected':''}" data-id="${esc(w.id)}" role="button" tabindex="0" aria-label="查看 ${esc(w.word)} 的详情"><div class="word-info"><div class="word-top"><span class="word-label">${esc(w.word)}</span>${statusHTML(w.status)}</div>${conceal?`<button class="mask-text" data-reveal="${esc(w.id)}" title="显示 ${esc(w.word)} 的释义">${svg('ic-eye')} 点击揭晓中文释义</button>`:`<div class="meaning" title="${esc(w.meaning)}">${esc(w.meaning)}</div>`}</div><button class="remove-btn" data-remove="${esc(w.id)}" aria-label="取消收藏 ${esc(w.word)}" title="移出生词本（可撤销）">${svg('ic-close')}</button></div>`;}).join(''):`<div class="empty">${svg('ic-search')}<strong>没有找到符合条件的单词</strong><span>尝试其他关键词，或清除筛选条件</span></div>`;}
function revealMarkup(id,text,asBlock=false){return `<button class="${asBlock?'mask-block':'mask-inline'}" data-reveal="${esc(id)}">${svg('ic-eye')} 点击显示中文答案</button>`;}
function renderDetails(){const w=words.find(w=>w.id===selectedId);if(!w){byId('details').innerHTML=`<div class="empty">${svg('ic-book')}<strong>请选择左侧的一个单词</strong><span>这里会显示词义、例句和学习状态</span></div>`;return;}
const conceal=hide&&!revealed.has(w.id);byId('details').innerHTML=`<div class="detail-topline"><div class="eyebrow">WORD DETAILS / 词条详情</div><div class="detail-id">${statusHTML(w.status)}</div></div>
<div class="detail-hero"><div class="hero-word">${esc(w.word)}</div><div class="phonetics"><button class="phonetic-btn" data-speak="en-GB" title="英式发音">${svg('ic-sound')} 英 ${esc(w.uk||'—')}</button><button class="phonetic-btn" data-speak="en-US" title="美式发音">${svg('ic-sound')} 美 ${esc(w.us||'—')}</button></div></div>
<div class="section"><h3 class="section-title">中文释义</h3>${conceal?revealMarkup(w.id,'',true):`<div class="definition">${esc(w.meaning)}</div>`}</div>
<div class="section"><h3 class="section-title">词性</h3><div class="parts">${(w.part||'待补充').split(' · ').map(s=>`<span class="part-tag">${esc(s)}</span>`).join('')}</div></div>
<div class="section"><h3 class="section-title">常见搭配</h3><div class="collocations">${(w.phrases||[]).length?w.phrases.map(p=>`<span class="collocation">${esc(p)}</span>`).join(''):'<span class="subdef">暂无搭配</span>'}</div></div>
<div class="section"><h3 class="section-title">常见例句</h3><div class="example-en">${esc(w.example||'暂无例句')}</div>${conceal?revealMarkup(w.id,'',false):`<div class="example-cn">${esc(w.exampleCn||'暂无例句翻译')}</div>`}</div>
<div class="study-panel"><div class="study-info"><h3 class="section-title">学习状态</h3><span class="study-helper">点击切换，模拟未来背单词进度</span></div><div class="study-actions">${Object.keys(statusMap).map(s=>`<button class="study-action ${s} ${w.status===s?'active':''}" data-status="${s}" aria-pressed="${w.status===s}"><span class="dot"></span>${statusMap[s]}</button>`).join('')}</div></div>
<div class="source-section"><span class="source-label">${svg('ic-bookmark')} ${esc(w.source||'外部导入')}</span><span>收藏于 ${new Date(w.createdAt).toLocaleDateString('zh-CN')}</span></div>`;}
function render(){if(selectedId&&!words.some(w=>w.id===selectedId))selectedId=visibleWords()[0]?.id||words[0]?.id||null;renderList();renderDetails();}
function closeMenus(){document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));document.querySelectorAll('[aria-haspopup="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));}
function renderMenu(kind){const container=byId(kind+'Options');const choices=kind==='filter'?Object.entries({all:'全部状态',...statusMap}):Object.entries(sortMap);const active=kind==='filter'?filter:sort;container.innerHTML=choices.map(([value,label])=>`<button class="menu-item ${value===active?'selected':''}" data-${kind}-value="${value}"><span>${label}</span>${value===active?svg('ic-check'):''}</button>`).join('');byId(kind+'Label').textContent=kind==='filter'?(filter==='all'?'筛选':statusMap[filter]):sortMap[sort];byId('filterButton').classList.toggle('on',filter!=='all');}
function message(text,undo=false){clearTimeout(toastTimer);clearInterval(toastCountdown);const root=byId('toastRoot');root.innerHTML=`<div class="toast ${undo?'':'simple'}">${svg('ic-check')}<span>${esc(text)}</span>${undo?'<button class="undo" id="undoButton">撤销</button><small id="undoSeconds">5s</small>':''}</div>`;
if(undo){let left=5;toastCountdown=setInterval(()=>{left--;const c=byId('undoSeconds');if(c)c.textContent=left+'s';if(left<=0){clearInterval(toastCountdown);undoItem=null;}},1000);byId('undoButton').addEventListener('click',()=>{if(!undoItem)return;words.splice(Math.min(undoItem.index,words.length),0,undoItem.word);selectedId=undoItem.word.id;undoItem=null;persist();render();message('已恢复收藏：'+words.find(w=>w.id===selectedId)?.word);});}
toastTimer=setTimeout(()=>{root.innerHTML='';undoItem=null;},undo?5000:3100);}
function removeWord(id){const i=words.findIndex(w=>w.id===id);if(i<0)return;undoItem={index:i,word:words[i]};words.splice(i,1);persist();render();message(`已将 ${undoItem.word.word} 移出生词本`,true);}
function toggleHide(){hide=!hide;revealed.clear();const b=byId('hideButton');b.classList.toggle('on',hide);b.setAttribute('aria-pressed',String(hide));b.innerHTML=svg(hide?'ic-eye':'ic-eye-off')+`<span>${hide?'显示全部释义':'隐藏释义'}</span>`;render();}
function speak(text,lang){if(!('speechSynthesis' in window)){message('当前浏览器不支持语音合成');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.87;const vs=speechSynthesis.getVoices();const match=vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));if(match)u.voice=match;speechSynthesis.speak(u);}catch(e){message('发音不可用，请检查系统语音组件');}}
function handleWordClick(e){const rem=e.target.closest('[data-remove]');if(rem){removeWord(rem.dataset.remove);return;}const rev=e.target.closest('[data-reveal]');if(rev){revealed.add(rev.dataset.reveal);render();return;}const card=e.target.closest('.word-card');if(card){selectedId=card.dataset.id;render();}}
byId('wordList').addEventListener('click',handleWordClick);byId('wordList').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('word-card')){e.preventDefault();selectedId=e.target.dataset.id;render();}});
byId('details').addEventListener('click',e=>{const rev=e.target.closest('[data-reveal]');if(rev){revealed.add(rev.dataset.reveal);render();return;}const stat=e.target.closest('[data-status]');if(stat){const w=words.find(w=>w.id===selectedId);if(!w)return;w.status=stat.dataset.status;persist();render();return;}const audio=e.target.closest('[data-speak]');if(audio){const w=words.find(w=>w.id===selectedId);if(w)speak(w.word,audio.dataset.speak);}});
byId('searchInput').addEventListener('input',e=>{query=e.target.value.trim().toLocaleLowerCase();renderList();});
['filter','sort'].forEach(kind=>{byId(kind+'Button').addEventListener('click',e=>{e.stopPropagation();const m=byId(kind+'Menu'),opening=!m.classList.contains('open');closeMenus();if(opening){m.classList.add('open');byId(kind+'Button').setAttribute('aria-expanded','true');}});byId(kind+'Menu').addEventListener('click',e=>{const b=e.target.closest(`[data-${kind}-value]`);if(!b)return;if(kind==='filter')filter=b.dataset.filterValue;else sort=b.dataset.sortValue;renderMenu(kind);closeMenus();renderList();});renderMenu(kind);});
document.addEventListener('click',e=>{if(!e.target.closest('.dropdown-wrap'))closeMenus();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();closeModal();}});
byId('hideButton').addEventListener('click',toggleHide);byId('startStudyButton').addEventListener('click',()=>{message('背单词页面尚未开发，这里先露出入口');});
document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.choice)));
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>message(b.dataset.nav==='背单词'?'背单词学习页面尚未开发，此处展示入口位置':'当前 HTML 只演示生词本页面')));
function openModal(){byId('importModal').classList.add('show');renderImportPreview();byId('closeModal').focus()}function closeModal(){byId('importModal').classList.remove('show')}
byId('importButton').addEventListener('click',openModal);byId('closeModal').addEventListener('click',closeModal);byId('importModal').addEventListener('click',e=>{if(e.target===byId('importModal'))closeModal();});
const HEADER_LABELS=['word','words','单词','词汇','生词','term','headword','english','英文','序号'];
let importPreview=null;
const normalizeKey=word=>String(word??'').trim().toLowerCase();
function parseCSVLine(line,delimiter){let fields=[],buffer='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){buffer+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){fields.push(buffer.trim());buffer=''}else buffer+=c}fields.push(buffer.trim());return fields}
function detectDelimiter(line){if(line.includes('\t'))return '\t';if(line.includes('|'))return '|';if(line.includes(';'))return ';';return ','}
function parseWordLines(text){return text.replace(/^\uFEFF/,'').split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const fields=parseCSVLine(line,detectDelimiter(line));return {word:String(fields[0]??'').trim(),meaning:fields.slice(1).map(field=>field.trim()).filter(Boolean).join('；')}})}
function parseWordJson(text){const data=JSON.parse(text);const list=Array.isArray(data)?data:Array.isArray(data?.words)?data.words:Array.isArray(data?.vocabulary)?data.vocabulary:Array.isArray(data?.items)?data.items:[];return list.map(item=>typeof item==='string'?{word:item,meaning:''}:{word:String(item?.word??item?.term??item?.text??''),meaning:String(item?.meaning??item?.definition??item?.translation??'')})}
function analyzeRows(rows){const existing=new Set(words.map(entry=>normalizeKey(entry.word)));const seen=new Set();const items=[];let duplicate=0,blank=0;for(const row of rows){const word=String(row.word??'').replace(/^\uFEFF/,'').trim();if(!word||HEADER_LABELS.includes(word.toLowerCase()))continue;const key=normalizeKey(word);if(existing.has(key)||seen.has(key)){duplicate++;continue}seen.add(key);const meaning=String(row.meaning??'').trim();if(!meaning)blank++;items.push({word,meaning:meaning||'待补充释义'})}return {items,duplicate,blank}}
function renderImportPreview(){const text=byId('importText').value;const rows=text.trim()?parseWordLines(text):[];const result=analyzeRows(rows);importPreview=result;const box=byId('importPreview'),confirm=byId('confirmImport');confirm.disabled=result.items.length===0;confirm.textContent=`导入 ${result.items.length} 个词`;if(!rows.length){box.className='import-preview empty';box.textContent='还没有内容：粘贴单词列表，或选择一个文件。';return}
box.className='import-preview';box.innerHTML=result.items.length?`<div class="preview-summary">识别到 <strong>${rows.length}</strong> 行：新增 <strong>${result.items.length}</strong> 个${result.duplicate?`，重复跳过 ${result.duplicate} 个`:''}${result.blank?`，${result.blank} 个待补充释义`:''}</div>`:'<div class="preview-summary">这些词都已经在生词本里，不用重复导入</div>'}
async function readImportFile(file){if(!file)return;if(file.size>5*1024*1024){message('文件超过 5 MB，请拆分后再导入');return}const buffer=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buffer);if(text.includes('\uFFFD')){try{text=new TextDecoder('gbk').decode(buffer)}catch(error){/* 保留 UTF-8 结果 */}}
if(/\.json$/i.test(file.name)||/^[\s\uFEFF]*[[{]/.test(text)){try{text=parseWordJson(text).map(row=>row.meaning?`${row.word}, ${row.meaning}`:row.word).join('\n')}catch(error){message('JSON 解析失败，请检查文件内容');return}}
byId('importText').value=text;renderImportPreview();message(`已读取 ${file.name}`)}
function confirmImport(){const result=importPreview;if(!result||!result.items.length)return;const createdAt=Date.now();const newItems=result.items.map((item,index)=>({word:item.word,meaning:item.meaning,part:'待补充',uk:'—',us:'—',phrases:[],example:'',exampleCn:'',status:'pending',source:'导入',createdAt:createdAt+result.items.length-index,id:'import-'+createdAt+'-'+index,note:''}));words=[...newItems,...words];selectedId=newItems[0].id;filter='all';sort='recent';query='';byId('searchInput').value='';byId('importText').value='';renderMenu('filter');renderMenu('sort');persist();render();renderImportPreview();closeModal();message(`导入完成：新增 ${newItems.length} 个词${result.duplicate?`，跳过重复 ${result.duplicate} 个`:''}，已加入待学习`)}
byId('importText').addEventListener('input',renderImportPreview);
byId('confirmImport').addEventListener('click',confirmImport);
byId('fileInput').addEventListener('change',event=>{void readImportFile(event.target.files?.[0]);event.target.value='';});
const drop=byId('dropzone');
['dragover','dragenter'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('dragging')}));
['dragleave','drop'].forEach(type=>drop.addEventListener(type,event=>{event.preventDefault();drop.classList.remove('dragging')}));
drop.addEventListener('drop',event=>void readImportFile(event.dataTransfer?.files?.[0]));
setTheme(theme);render();
})();
</script>
</body>
</html>
