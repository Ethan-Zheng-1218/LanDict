<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanDict · 学习卡片紧凑版</title>
  <link rel="stylesheet" href="study-refinement-preview.css">
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5c2.8-.8 5.2-.3 8 1.4v12c-2.8-1.7-5.2-2.2-8-1.4z"/><path d="M20 5.5c-2.8-.8-5.2-.3-8 1.4v12c2.8-1.7 5.2-2.2 8-1.4z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m4 10 8-6 8 6v9H5z"/><path d="M9.5 19v-6h5v6"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="M4 6h9M8.5 3v3M6 6c.7 3.2 2.8 5.7 6 7"/><path d="M11 8c-.9 2.2-2.8 4.2-6 5.5M14 20l3.5-9 3.5 9M15.2 17h4.6"/></symbol>
    <symbol id="i-reading" viewBox="0 0 24 24"><path d="M4 5.5c2.8-.8 5.2-.3 8 1.4v12c-2.8-1.7-5.2-2.2-8-1.4z"/><path d="M20 5.5c-2.8-.8-5.2-.3-8 1.4v12c2.8-1.7 5.2-2.2 8-1.4z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4"/></symbol>
    <symbol id="i-study" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5z"/><path d="M7 12v4.5c2.7 2 7.3 2 10 0V12M21 9v6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7L10.5 2h-3l-.7 2-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2h3l.7-2 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7z" transform="translate(3 0) scale(.75)"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/><path d="M9 12h9"/></symbol>
  </svg>

  <nav class="preview-toolbar" aria-label="预览页面切换">
    <a href="study-home-refinement-preview.html">学习内容</a>
    <a href="study-session-refinement-preview.html" aria-current="page">学习卡片</a>
  </nav>

  <div class="preview-canvas">
    <div class="app-shell">
      <header class="brandbar">
        <span class="brand-mark"><svg class="icon"><use href="#i-book"/></svg></span>
        <span class="brand-name">LanDict</span>
      </header>
      <div class="titlebar" aria-hidden="true"><div class="window-controls"><span>—</span><span>□</span><span>×</span></div></div>
      <aside class="sidebar">
        <nav class="nav-list" aria-label="主导航">
          <a class="nav-item" href="#"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></a>
          <a class="nav-item" href="#"><svg class="icon"><use href="#i-translate"/></svg><span>翻译</span></a>
          <a class="nav-item" href="#"><svg class="icon"><use href="#i-reading"/></svg><span>阅读</span></a>
          <a class="nav-item" href="#"><svg class="icon"><use href="#i-file"/></svg><span>生词本</span></a>
          <a class="nav-item active" href="#" aria-current="page"><svg class="icon"><use href="#i-study"/></svg><span>背单词</span></a>
        </nav>
        <div class="settings-link"><a class="nav-item" href="#"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></a></div>
      </aside>

      <main class="main">
        <div class="session-content">
          <header class="session-head">
            <button class="back-button" type="button" aria-label="退出学习"><svg class="icon"><use href="#i-back"/></svg></button>
            <span class="session-count">第 1 / 20</span>
            <span class="session-progress" aria-label="本轮进度 5%"><i></i></span>
            <span class="session-book">四级词库 · 背新单词</span>
          </header>

          <section class="word-stage" aria-label="当前单词"><div class="word">probably</div></section>

          <section class="session-actions" aria-label="学习判断">
            <div class="quiet-row"><button class="quiet-button" type="button"><kbd>↑</kbd><span>加入生词本</span></button></div>
            <div class="grade-row">
              <button class="grade-button" type="button"><kbd>←</kbd><span>不认识</span></button>
              <button class="grade-button" type="button"><kbd>↓</kbd><span>不确定</span></button>
              <button class="grade-button primary" type="button"><span>认识</span><kbd>→</kbd></button>
            </div>
            <div class="session-hints">
              <span>双击 <kbd>←</kbd> 返回上一个单词</span>
              <span><kbd>空格</kbd> 发音</span>
              <span>双击 <kbd>→</kbd> 不再出现</span>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
